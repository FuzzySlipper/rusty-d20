name: C# product CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  csharp-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision adjacent Rusty Engine checkout
        run: git clone --depth 1 https://github.com/FuzzySlipper/rusty-engine.git ../rusty-engine
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project src/RustyD20.Core.Checks/RustyD20.Core.Checks.csproj
      - run: dotnet run --project src/RustyD20.Product.Checks/RustyD20.Product.Checks.csproj
      - run: dotnet build RustyD20.sln -c Release
      - run: dotnet publish src/RustyD20.NativeProduct/RustyD20.NativeProduct.csproj -c Release -r linux-x64
