[package]
name = "rusty-d20"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
anyhow.workspace = true
axum = "0.8"
rusty-engine.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "11", features = ["serde-compat"] }
winit.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "rusty-d20-host"
path = "src/bin/host.rs"

[[bin]]
name = "rusty-d20-protocol"
path = "src/bin/protocol.rs"

[[bin]]
name = "rusty-d20-rules-contract"
path = "src/bin/rules_contract.rs"

[[bin]]
name = "rusty-d20-native"
path = "src/bin/native_host.rs"
